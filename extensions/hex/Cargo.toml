[package]
name = "fenix-hex"
version = "1.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Binary files as a hex dump in Fenix: offsets, bytes and their text, searched, inspected as numbers, copied as hex -- read a block at a time, so a file of any size opens at once."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", rev = "a39d18b273ace00091d8d170382456bbad0a7c2f" }
fenix-ui-kit = { path = "../../crates/ui-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Speed over size: a search goes through a big file within a key's time.
opt-level = 3
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
