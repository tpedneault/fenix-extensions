version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: example.com/orbit/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative
  - local: protoc-gen-doc
    out: gen/docs
inputs:
  - directory: proto
