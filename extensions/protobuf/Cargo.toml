[package]
name = "fenix-protobuf"
version = "1.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Protocol Buffers and gRPC in Fenix: the grammar, buf's language server, buf format, buf lint on save, buf breaking, buf generate and buf build as tasks, the project doctor's checks with their fixes, and a gRPC client on grpcurl."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", tag = "v1.5.0" }
fenix-lang-kit = { path = "../../crates/lang-kit" }
fenix-ui-kit = { path = "../../crates/ui-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# buf.yaml and buf.gen.yaml, read.
yaml-rust2 = "0.13.0"

[dev-dependencies]
# lang-kit's test host.
fenix-lang-kit = { path = "../../crates/lang-kit", features = ["mock"] }
# The snippets read by Fenix's own code.
fenix-snippets = { git = "https://github.com/tpedneault/fenix", tag = "v1.0.0" }
# The language file, read as fenix-gui reads it.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# The proto grammar loaded and its queries run as Fenix does: tree-sitter
# 0.26's WebAssembly store (fenix-syntax's).
tree-sitter = { version = "0.26.13", features = ["wasm"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
