[extension]
id = "fenix.ruby"
name = "Ruby"
version = "1.2.0"
description = "Ruby: tree-sitter-ruby's highlighting, folding and indenting, Ruby LSP or Solargraph, RuboCop and Standard formatting and linting with their corrections, Bundler's, Rake's, RSpec's and Rails' tasks, the project's checks with their fixes, and snippets"
authors = ["Thomas Pedneault"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpedneault/fenix-extensions"
categories = ["languages", "snippets"]
runtime = "wasm"

[engine]
fenix = ">=1.5, <2"
# lang-kit, the kit it's built on, is on 1.5.
api = "1.5"

# With Fenix: the project doctor's checks and the language server are
# there from the start.
[activation]
on_startup = true

[permissions]
# Ruby, RubyGems and Bundler (the project's gems run by `bundle exec`),
# Rake, RSpec, the servers, RuboCop and Standard where they're installed.
process = ["ruby", "gem", "bundle", "rake", "rspec", "ruby-lsp", "solargraph", "rubocop", "standardrb"]
# The Gemfile, Gemfile.lock, .ruby-version and the like, read.
filesystem = "project-read"
# The file saved, for RuboCop on save.
editor = "read"

[contributes]
# A file saved: linted (by its path, file_saved); the Gemfile, its lock,
# the Rakefile and the like, read again.
events = ["saved"]

[[contributes.contexts]]
name = "ruby"
markers = ["Gemfile", "gems.rb", "Rakefile", ".ruby-version", "config.ru"]
languages = ["ruby"]

# The kind of project this pack knows, for Fenix 1.6 and later (an earlier Fenix
# ignores it, and the pack still installs there): how it is named, tagged and
# found, apart from the context above, whose markers only say when this pack applies.
# Not Rakefile: plenty of projects that aren't Ruby have one, and a kind is what a
# project IS (it stays in the context above, where a false match is cheap).
[[contributes.project_kinds]]
id = "ruby"
name = "Ruby"
tag = "RB"
color = "constant"
markers = ["Gemfile", "gems.rb", ".ruby-version", "config.ru"]
main = ["config.ru"]

[[contributes.commands]]
id = "ruby.doctor"
title = "Ruby: check the project again (Ruby, Bundler, the gems, the server, RuboCop)"

[[contributes.commands]]
id = "ruby.reload"
title = "Ruby: read the project again, and Rake's tasks"

[[contributes.commands]]
id = "ruby.bundle-install"
title = "Ruby: install the gems in Gemfile.lock (bundle install)"

[[contributes.commands]]
id = "ruby.install-bundler"
title = "Ruby: install Bundler (gem install bundler)"

[[contributes.commands]]
id = "ruby.install-server"
title = "Ruby: install the language server (Ruby LSP or Solargraph)"

[[contributes.commands]]
id = "ruby.install-rubocop"
title = "Ruby: install RuboCop (or Standard)"

[[contributes.settings]]
key = "ruby.server"
kind = "choice"
choices = ["ruby-lsp", "solargraph"]
label = "Language server"
description = "The one to use when both are installed; with one, that one. Solargraph runs as the project's (bundle exec) when its Gemfile.lock pins it."
default = "ruby-lsp"

[[contributes.settings]]
key = "ruby.lint"
kind = "choice"
choices = ["auto", "save", "off"]
label = "RuboCop on save"
description = "auto: RuboCop (or Standard) on each file saved, with its corrections, unless Ruby LSP gives the project's RuboCop's problems as you type. save: on each file saved whatever the server. off: never."
default = "auto"
project = true

[[contributes.settings]]
key = "ruby.format"
kind = "bool"
label = "Format with RuboCop"
description = "RuboCop's layout corrections (Standard's in a project that uses it) as the formatter, for SPC c F and format on save. Off leaves formatting to the language server."
default = "true"
project = true
