# The diagrams' SPC m menu, in a Mermaid file. Your own keybindings.toml wins.

[[local.mermaid]]
keys = "p"
label = "preview beside"
command = "diagram.preview"

[[local.mermaid]]
keys = "v"
label = "view it on its own"
command = "diagram.viewer"

[[local.mermaid]]
keys = "t"
label = "set its theme"
command = "diagram.theme"

[[local.mermaid]]
keys = "e"
label = "export"
command = "diagram.export"

[[local.mermaid]]
keys = "y"
label = "copy as a picture"
command = "diagram.copy_picture"

[[local.mermaid]]
keys = "n"
label = "a new diagram"
command = "diagram.new"

[[local.mermaid]]
keys = "l"
label = "the project's diagrams"
command = "diagram.list"

[[local.mermaid]]
keys = "M"
label = "move or rename it"
command = "diagram.move"
