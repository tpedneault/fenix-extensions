[extension]
id = "fenix.go"
name = "Go"
version = "1.2.0"
description = "Go: gopls, debugging with Delve, go vet or golangci-lint on save, gofmt or goimports as the formatter, tasks, the project's checks with their fixes, outdated and vulnerable modules, snippets, and CLI, HTTP service and library projects"
authors = ["Thomas Pedneault"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpedneault/fenix-extensions"
categories = ["languages", "snippets", "templates"]
runtime = "wasm"

[engine]
fenix = ">=1.5, <2"
# lang-kit, the kit it's built on, is on 1.5.
api = "1.5"

# With Fenix: the project doctor's checks and the language server are
# there from the start.
[activation]
on_startup = true

[permissions]
# Go builds, tests, vets and manages modules; gofmt and goimports format;
# gopls, Delve, govulncheck and golangci-lint are what `go install`
# puts in ~/go/bin; Homebrew and winget install Go itself.
process = [
    "go", "gofmt", "goimports", "gopls", "dlv", "govulncheck", "golangci-lint",
    "brew", "winget",
]
# A Delve already running headless, for go.delve_server: its address, or
# Delve's own port.
sockets = ["${setting:go.delve_server}", "127.0.0.1:2345", "localhost:2345"]
# go.mod, go.work, the main packages and .env, read.
filesystem = "project-read"
# The file saved, for the linter.
editor = "read"

[contributes]
# A file saved: linted; go.mod and the like, read again.
events = ["saved"]

[[contributes.contexts]]
name = "go"
markers = ["go.mod", "go.work"]
languages = ["go"]

[[contributes.commands]]
id = "go.packages"
title = "Go: modules -- outdated and vulnerable, upgrade, add, remove"
external = true

[[contributes.commands]]
id = "go.doctor"
title = "Go: check the project again (Go, go.mod, gopls, Delve, govulncheck)"

[[contributes.commands]]
id = "go.tidy"
title = "Go: tidy go.mod and go.sum (go mod tidy)"

[[contributes.commands]]
id = "go.install-go"
title = "Go: install Go (Homebrew or winget)"

[[contributes.commands]]
id = "go.install-gopls"
title = "Go: install gopls (go install)"

[[contributes.commands]]
id = "go.install-delve"
title = "Go: install Delve (go install)"

[[contributes.commands]]
id = "go.install-govulncheck"
title = "Go: install govulncheck (go install)"

[[contributes.commands]]
id = "go.install-golangci-lint"
title = "Go: install golangci-lint (go install)"

[[contributes.settings]]
key = "go.linter"
kind = "choice"
choices = ["golangci-lint", "go vet", "off"]
label = "Linter on save"
description = "What runs on a Go file's package when it's saved. golangci-lint falls back to go vet when it isn't installed."
default = "golangci-lint"

[[contributes.settings]]
key = "go.formatter"
kind = "choice"
choices = ["goimports", "gofmt"]
label = "Formatter"
description = "goimports also adds and removes imports; it's used when it's installed, else gofmt."
default = "goimports"

[[contributes.settings]]
key = "go.delve_server"
kind = "text"
label = "Headless Delve"
description = "Empty: Fenix starts dlv dap for each session. An address (127.0.0.1:2345): debug through the Delve already running there with --headless --accept-multiclient, which the headless attach launch needs."
default = ""
