[package]
name = "fenix-kubernetes"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Kubernetes in Fenix, driving kubectl: contexts and namespaces, workloads, pods, services, live logs, shells, port-forwards, YAML and describe, changes asked about first."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", tag = "v1.5.0" }
fenix-ui-kit = { path = "../../crates/ui-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The API with a fake host in its tests: kubectl's answers given by hand.
fenix-test-kit = { path = "../../crates/test-kit" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
