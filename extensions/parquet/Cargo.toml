[package]
name = "fenix-parquet"
version = "1.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Parquet files read in Fenix: their rows as a table, read a page at a time, and their schema with each column's type, nulls, range, size and codec."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", tag = "v1.0.0" }
fenix-ui-kit = { path = "../../crates/ui-kit" }
# Every codec Parquet writers use, all of them pure Rust: zstd's through
# the patch below.
parquet = { version = "57", default-features = false, features = ["arrow", "snap", "flate2", "flate2-rust_backened", "lz4", "brotli", "zstd"] }
# Timestamps in a named zone (UTC, Europe/Paris), not only an offset.
arrow-array = { version = "57", features = ["chrono-tz"] }
arrow-cast = { version = "57", default-features = false }
arrow-ord = "57"
arrow-schema = "57"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# zstd-sys's C doesn't build for wasm32-wasip2: zstd frames are decoded by
# ruzstd instead, behind the zstd crate's Decoder.
[patch.crates-io]
zstd = { path = "../../crates/zstd-shim" }

[profile.release]
# Speed over size: a page of rows is decoded within a key's time.
opt-level = 3
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
