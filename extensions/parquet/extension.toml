[extension]
id = "fenix.parquet"
name = "Parquet viewer"
version = "1.1.0"
description = "Parquet files read in a pane: their rows as a table, read a page at a time so a billion rows open at once, and their schema with each column's type, nulls, range, size and codec -- snappy, zstd, gzip, LZ4 and Brotli"
authors = ["Thomas Pedneault"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpedneault/fenix-extensions"
categories = ["tools", "data"]
runtime = "wasm"

[engine]
fenix = ">=1.5, <2"
# Built on ui-kit, which is on extension API 1.5.
api = "1.5"

[permissions]
# A file in the project is read where it is, as far as each read needs;
# one elsewhere Fenix reads whole for it.
filesystem = "project-read"
# Where you are: which project is open, so a file in it is read there
# (else every file is read whole, up to 64 MiB).
editor = "read"

[contributes]
# A .parquet opens in it however you open it, which starts it.
opens = ["*.parquet", "*.parq"]
