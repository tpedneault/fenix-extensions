[package]
name = "fenix-ccsds-extension"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "CCSDS and ECSS in Fenix: packets, frames and CLTUs decoded, recordings and live telemetry, on-board times, hex, and the standards."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", tag = "v1.0.0" }
fenix-mib = { path = "../../crates/mib" }
fenix-ccsds = { path = "../../crates/ccsds" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
