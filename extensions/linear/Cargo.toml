[package]
name = "fenix-linear"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Linear in Fenix: your issues, a team's cycle and backlog, an issue with its comments, a new-issue form, a branch started from an issue -- and Linear for the agenda."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", tag = "v1.5.0" }
fenix-ui-kit = { path = "../../crates/ui-kit" }
fenix-linear-client = { path = "../../crates/linear" }
fenix-tracker = { path = "../../crates/tracker" }
serde_json = "1"

[dev-dependencies]
# A fake host for its tests.
fenix-test-kit = { path = "../../crates/test-kit" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
