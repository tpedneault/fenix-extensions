lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      '@babel/core':
        specifier: ^7.23.0
        version: 7.23.7
      react:
        specifier: ^18.2.0
        version: 18.2.0(@types/react@18.2.48)
    devDependencies:
      typescript:
        specifier: ~5.3.0
        version: 5.3.3

  packages/other:
    dependencies:
      react:
        specifier: ^17.0.0
        version: 17.0.2

packages:

  '@babel/core@7.23.7':
    resolution: {integrity: sha512-x}

  react@18.2.0:
    resolution: {integrity: sha512-y}
