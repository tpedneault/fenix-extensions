[package]
name = "fenix-review"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Code review in Fenix: GitHub pull requests and GitLab merge requests -- the reviews waiting, a review with its threads, comments and verdict, and a new request -- as a forge for Fenix's Git pages."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", tag = "v1.0.0" }
fenix-diff = { git = "https://github.com/tpedneault/fenix", tag = "v1.0.0" }
fenix-forge = { path = "../../crates/forge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
