[extension]
id = "fenix.containers"
name = "Containers"
version = "1.2.0"
description = "Docker, Podman and wslc: containers, Compose, live logs, performance, images, volumes and networks"
authors = ["Thomas Pedneault"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpedneault/fenix-extensions"
categories = ["tools"]
runtime = "wasm"

[engine]
# Notifications: Fenix 1.2 (extension API 1.3).
fenix = ">=1.2, <2"
# A notification when a build or a pull ends while you're elsewhere
# (notify_with, 1.3); the build as a task whose end it hears
# (run_in_background); agents' tools with a class, a deadline, and calls
# given up on (service_cancelled, 1.2).
api = "1.3"

# Nothing loads until one of its commands runs.
[activation]
commands = ["containers.*"]

[permissions]
process = ["docker", "podman", "wslc"]
# A compose.yaml in the project, read for the Compose tab.
filesystem = "project-read"

[contributes]
# Coding agents' tools: they only read.
services = ["containers.list", "containers.logs", "containers.images"]

# Agents see them as containers_list, containers_logs and
# containers_images. Each runs one engine command that reads (ps, logs
# --tail, images); an engine that isn't running is said so, not started.
[[contributes.agent_tools]]
name = "list"
description = "The containers Docker, Podman or wslc has on this machine: each one's id, name, image, state (running, exited...), status, health, exit code, published ports and Compose project and service. Stopped ones too unless all is false. Only reads."
service = "containers.list"
input = '{"type":"object","properties":{"all":{"type":"boolean","description":"Stopped containers too; default true"}}}'
class = "read"
timeout_ms = 60000

[[contributes.agent_tools]]
name = "logs"
description = "The last lines of one container's log, at most 2000 lines and 64 KiB, saying when it was cut. A log can hold secrets a program printed (tokens, passwords): pass on only what's needed. Never its environment or inspect. Only reads; nothing is started or stopped."
service = "containers.logs"
input = '{"type":"object","properties":{"container":{"type":"string","description":"A name or id, as containers_list gives them"},"lines":{"type":"integer","description":"Lines from the end; default 200, at most 2000"}},"required":["container"]}'
class = "read"
timeout_ms = 60000

[[contributes.agent_tools]]
name = "images"
description = "The images Docker, Podman or wslc has on this machine: each one's repository, tag, id, size in bytes, age, and whether it's dangling (untagged, left by a rebuild). Only reads."
service = "containers.images"
input = '{"type":"object","properties":{}}'
class = "read"
timeout_ms = 60000

[[contributes.commands]]
id = "containers.open"
title = "Containers: open"
external = true

[[contributes.commands]]
id = "containers.performance"
title = "Containers: performance"
external = true

[[contributes.commands]]
id = "containers.build"
title = "Containers: build the project's image"

[[contributes.commands]]
id = "containers.build_output"
title = "Containers: the last build's output"

[[contributes.settings]]
key = "containers.engine"
kind = "choice"
description = "The container engine to use: docker, podman or wslc. Empty uses the first that runs."
default = ""
choices = ["", "docker", "podman", "wslc"]
