[package]
name = "fenix-logs"
version = "1.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Log files read in Fenix: each entry's level and time, stack traces folded into the entry that starts them, filtered by level, text, time and field, followed as they grow -- read a block at a time, so a log of gigabytes opens at once."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", tag = "v1.5.0" }
fenix-ui-kit = { path = "../../crates/ui-kit" }
memchr = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
# Speed over size: a log is indexed and filtered in the sandbox, a few
# MiB at a time between frames.
opt-level = 3
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
