[package]
name = "fenix-gallery"
version = "1.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "A page showing every ui-kit widget working, each with the code that draws it a key away: the kit's living documentation."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", rev = "a39d18b273ace00091d8d170382456bbad0a7c2f" }
fenix-ui-kit = { path = "../../crates/ui-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The API with a fake host in its tests (the hint's keys), and canvases as
# text for the snapshots.
fenix-test-kit = { path = "../../crates/test-kit" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
