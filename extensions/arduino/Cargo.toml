[package]
name = "fenix-arduino"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Arduino sketches in Fenix: build, upload, the serial monitor, debugging, boards, ports, libraries, and the right language server."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", tag = "v1.0.0" }
serde_json = "1"
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
