# The Board (4), the Roadmap (5), Trace with its gaps (2, then m) and the
# Exports tab (0, with the demo's `design-doc` plan) are one key away from
# the Tree, and a script can't press one: they need either a way to open a
# page on a tab by a command that is external, or the control channel
# taking keys. The Exports tab's plan is `kiln export --dry-run` of the
# demo's file target, so it needs no Confluence.
