[package]
name = "fenix-kiln"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Kiln in Fenix, driving the kiln program: a Kiln project's plan, edits, exports and agent tools."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", tag = "v1.5.0" }
fenix-ui-kit = { path = "../../crates/ui-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The API with a fake host in its tests: what kiln prints given by hand.
fenix-test-kit = { path = "../../crates/test-kit" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
