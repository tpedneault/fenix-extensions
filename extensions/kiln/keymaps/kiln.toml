# Kiln's keys, after SPC m in a Kiln project or on its page. Your own
# keybindings.toml wins.

[[local.kiln]]
keys = "o"
label = "open the plan"
command = "kiln.open"

[[local.kiln]]
keys = "r"
label = "read the project again"
command = "kiln.reload"

[[local.kiln]]
keys = "s"
label = "show the item under the cursor"
command = "kiln.show"

[[local.kiln]]
keys = "i"
label = "impact of the item under the cursor"
command = "kiln.impact"

[[local.kiln]]
keys = "f"
label = "find an item"
command = "kiln.find"
