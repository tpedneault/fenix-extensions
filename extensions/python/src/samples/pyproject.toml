[project]
name = "orbit-api"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic_settings>=2.4; python_version >= '3.11'",
]

[project.optional-dependencies]
client = ["httpx>=0.27", "orjson"]

[project.scripts]
orbit = "orbit_api.cli:main"
orbit-admin = "orbit_api.admin:main"

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy>=1.11", { include-group = "docs" }]
docs = ["mkdocs"]

[tool.uv]
dev-dependencies = ["pytest-cov"]

[tool.ruff]
line-length = 100
