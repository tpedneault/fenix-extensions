[package]
name = "fenix-python"
version = "1.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Python in Fenix: basedpyright with ruff's server beside it, debugpy, ruff as the formatter, tasks, the project doctor's checks and the package manager page, for uv's projects and pip's."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", tag = "v1.5.0" }
# The later host calls: ruff's server beside basedpyright, fixes, launches;
# and the test provider for Fenix 1.6 (`tests`), offered once the pack is on
# API 1.6.
fenix-lang-kit = { path = "../../crates/lang-kit", features = ["tests"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
# lang-kit's test host.
fenix-lang-kit = { path = "../../crates/lang-kit", features = ["mock"] }
# Fenix's side of the test provider, on recorded pytest output.
fenix-test-kit = { path = "../../crates/test-kit", default-features = false, features = ["tests"] }
# The snippets and project templates read by Fenix's own code.
fenix-snippets = { git = "https://github.com/tpedneault/fenix", tag = "v1.0.0" }
fenix-project = { git = "https://github.com/tpedneault/fenix", tag = "v1.0.0" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
