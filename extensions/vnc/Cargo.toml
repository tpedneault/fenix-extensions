[package]
name = "fenix-vnc"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Remote desktops in a pane: a VNC (RFB) viewer for Fenix."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", tag = "v1.0.0" }
# ZRLE's zlib stream, and the screenshots' PNG: both pure Rust.
flate2 = "1"
png = "0.17"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
