[package]
name = "fenix-pets"
version = "1.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Little 3D pets that live on the modeline."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Extension API 1.5 (key_for; 1.1's git-state, last-task): Fenix 1.5.
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", tag = "v1.5.0" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
