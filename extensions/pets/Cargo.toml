[package]
name = "fenix-pets"
version = "1.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Little 3D pets that live on the modeline."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Extension API 1.1 (git-state, last-task): Fenix 1.0.1, as merged on master.
# Tag v1.0.1 once it's out.
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", rev = "aeaa0a65358bc5c756a04ecd8156216c7b549371" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
