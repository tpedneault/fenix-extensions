[extension]
id = "fenix.jira"
name = "Jira"
version = "1.4.0"
description = "Your Jira Cloud, Server or Data Center: searches, issues and their workflow, a new-issue form with the project's real fields -- and the agenda kept in step with it"
authors = ["Thomas Pedneault"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpedneault/fenix-extensions"
categories = ["tools"]
runtime = "wasm"

[engine]
fenix = ">=1.5, <2"
api = "1.5"

# Its commands load it, and so does the agenda's first call to Jira.
[activation]
commands = ["jira.*"]

[permissions]
# Your Jira, and only it: the site in your settings -- and, for a scoped
# Jira Cloud API token, which Atlassian takes only through its gateway,
# api.atlassian.com/ex/jira/<your site's cloud id>.
network = ["${setting:jira.base_url}", "api.atlassian.com"]
secrets = ["jira.token"]
# The project's Jira key (`.fenix/project.toml`), for its searches.
editor = "read"

[contributes]
# The tracker seam the agenda calls (`jira.tracker.*`); and, for the
# agenda 1.2 from before it, the four it called then.
services = [
    "jira.tracker.about", "jira.tracker.assigned", "jira.tracker.issues", "jira.tracker.transitions",
    "jira.tracker.transition", "jira.tracker.update", "jira.tracker.priorities", "jira.tracker.people",
    "jira.tracker.comment", "jira.tracker.worklog", "jira.tracker.create", "jira.tracker.remember",
    "jira.request", "jira.config", "jira.set_blocked", "jira.new_issue",
]

[[contributes.commands]]
id = "jira.open"
title = "Jira: open -- your searches, their issues, a preview"
external = true

[[contributes.commands]]
id = "jira.refresh"
title = "Jira: run the search again"

[[contributes.commands]]
id = "jira.goto_issue"
title = "Jira: open an issue by key"
external = true

[[contributes.commands]]
id = "jira.search"
title = "Jira: search -- words, or JQL after :"
external = true

[[contributes.commands]]
id = "jira.create_issue"
title = "Jira: create an issue"

[[contributes.settings]]
key = "jira.email"
kind = "text"
label = "Jira email"
description = "Jira Cloud only: your Atlassian account's email. Cloud signs you in with it and an API token (the Jira token)."

[[contributes.settings]]
key = "jira.kind"
kind = "choice"
choices = ["auto", "cloud", "server"]
label = "Which Jira"
description = "auto: *.atlassian.net is Jira Cloud, any other address Server or Data Center, as the site itself says. cloud or server to say so yourself."
default = "auto"

[[contributes.settings]]
key = "jira.scoped_token"
kind = "bool"
label = "Scoped API token"
description = "Jira Cloud only: the API token is a scoped one, which Atlassian takes only through api.atlassian.com."
default = "false"

[[contributes.settings]]
key = "jira.sync_minutes"
kind = "minutes"
label = "Sync every"
description = "How often linked agenda tasks are brought up to date, in minutes."
default = "10"

[[contributes.settings]]
key = "jira.projects"
kind = "map"
columns = ["Key", "Name"]
label = "Projects"
description = "Jira projects the Jira page lists open issues and the current sprint for."

[[contributes.settings]]
key = "jira.users"
kind = "map"
columns = ["Username", "Name"]
label = "People"
description = "People the Jira page lists issues assigned to."

[[contributes.settings]]
key = "jira.queries"
kind = "map"
columns = ["Name", "JQL"]
label = "Saved searches"
description = "Searches saved on the Jira page, by name."

[[contributes.settings]]
key = "jira.blocked"
kind = "map"
columns = ["Project", "Meaning"]
label = "What Blocked means"
description = "Per project: flag, local, or the status to move to, as ID: Name. Learned the first time you block a task."

[[contributes.settings]]
key = "jira.priorities"
kind = "map"
columns = ["Jira priority", "Agenda priority"]
label = "Priority names"
description = "How a Jira priority maps onto the agenda's."
