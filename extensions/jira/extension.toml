[extension]
id = "fenix.jira"
name = "Jira"
version = "1.3.0"
description = "Your Jira Server or Data Center: searches, issues and their workflow, a new-issue form with the project's real fields -- and the agenda kept in step with it"
authors = ["Thomas Pedneault"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpedneault/fenix-extensions"
categories = ["tools"]
runtime = "wasm"

[engine]
fenix = ">=1.5, <2"
api = "1.5"

# Its commands load it, and so does the agenda's first call to Jira.
[activation]
commands = ["jira.*"]

[permissions]
# Your Jira, and only it: the server in your settings.
network = ["${setting:jira.base_url}"]
secrets = ["jira.token"]
# The project's Jira key (`.fenix/project.toml`), for its searches.
editor = "read"

[contributes]
# The tracker seam the agenda calls (`fenix.jira.tracker.*`, named by
# its full id); and, for the agenda 1.2 from before it, the four it
# called then -- jira.request deprecated, gone at 2.0.
services = [
    "fenix.jira.tracker.about", "fenix.jira.tracker.assigned", "fenix.jira.tracker.issues",
    "fenix.jira.tracker.transitions", "fenix.jira.tracker.transition", "fenix.jira.tracker.update",
    "fenix.jira.tracker.priorities", "fenix.jira.tracker.people", "fenix.jira.tracker.comment",
    "fenix.jira.tracker.worklog", "fenix.jira.tracker.create", "fenix.jira.tracker.remember",
    "jira.request", "jira.config", "jira.set_blocked", "jira.new_issue",
]

[[contributes.commands]]
id = "jira.open"
title = "Jira: open -- your searches, their issues, a preview"
external = true

[[contributes.commands]]
id = "jira.refresh"
title = "Jira: run the search again"

[[contributes.commands]]
id = "jira.goto_issue"
title = "Jira: open an issue by key"
external = true

[[contributes.commands]]
id = "jira.search"
title = "Jira: search -- words, or JQL after :"
external = true

[[contributes.commands]]
id = "jira.create_issue"
title = "Jira: create an issue"

[[contributes.settings]]
key = "jira.sync_minutes"
kind = "minutes"
label = "Sync every"
description = "How often linked agenda tasks are brought up to date, in minutes."
default = "10"

[[contributes.settings]]
key = "jira.projects"
kind = "map"
columns = ["Key", "Name"]
label = "Projects"
description = "Jira projects the Jira page lists open issues and the current sprint for."

[[contributes.settings]]
key = "jira.users"
kind = "map"
columns = ["Username", "Name"]
label = "People"
description = "People the Jira page lists issues assigned to."

[[contributes.settings]]
key = "jira.queries"
kind = "map"
columns = ["Name", "JQL"]
label = "Saved searches"
description = "Searches saved on the Jira page, by name."

[[contributes.settings]]
key = "jira.blocked"
kind = "map"
columns = ["Project", "Meaning"]
label = "What Blocked means"
description = "Per project: flag, local, or the status to move to, as ID: Name. Learned the first time you block a task."

[[contributes.settings]]
key = "jira.priorities"
kind = "map"
columns = ["Jira priority", "Agenda priority"]
label = "Priority names"
description = "How a Jira priority maps onto the agenda's."

[[contributes.settings]]
key = "jira.seam_writes"
kind = "choice"
choices = ["ask", "always", "never"]
label = "Changes from the agenda"
description = "Whether the agenda (or any extension using the tracker seam) may change your issues: ask once a session, always, or never."
default = "ask"
