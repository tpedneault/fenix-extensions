[package]
name = "fenix-jira"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Jira in Fenix: searches, issues, the new-issue form, and Jira for the agenda."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", tag = "v1.0.0" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fenix-jira-client = { path = "../../crates/jira" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
