[package]
name = "fenix-ci"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "CI status in Fenix: the branch's GitHub Actions runs or GitLab pipelines on the modeline, a page of their jobs, steps and logs, notifications when they finish, and a tool for coding agents."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# API 1.3: notifications.
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", branch = "release/v1.2" }
# The forges' HTTP seam (`Http`), query strings, and GitLab's project paths.
fenix-forge = { path = "../../crates/forge" }
serde_json = "1"

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
