[package]
name = "fenix-regex"
version = "1.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "A regex playground in Fenix: matches and groups live, the replacement, the pattern explained, escaped for other languages, and a cheatsheet."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", rev = "a39d18b273ace00091d8d170382456bbad0a7c2f" }
regex = "1"
regex-syntax = "0.8"
fancy-regex = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# A fake host for its tests, and its pages as text to snapshot.
fenix-test-kit = { path = "../../crates/test-kit" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
