[package]
name = "fenix-regex"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "A regex playground in Fenix: matches and groups live, the replacement, the pattern explained, escaped for other languages, and a cheatsheet."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", tag = "v1.0.0" }
regex = "1"
regex-syntax = "0.8"
fancy-regex = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
