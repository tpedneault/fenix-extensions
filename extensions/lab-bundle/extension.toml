[extension]
id = "fenix.lab-bundle"
name = "Lab"
version = "1.1.0"
description = "Arduino, containers, Kubernetes, VNC"
authors = ["Thomas Pedneault"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpedneault/fenix-extensions"
categories = ["tools"]
# A bundle: nothing of its own, the extensions below. Installing it
# installs them; removing it removes those nothing else needs.
runtime = "bundle"

[engine]
# Kubernetes has no release for an older Fenix, and Fenix installs a
# bundle's members or none: an older Fenix keeps 1.0.0, without it.
fenix = ">=1.5, <2"

[dependencies]
"fenix.containers" = "^1"
"fenix.kubernetes" = "^1"
"fenix.arduino" = "^1"
"fenix.vnc" = "^1"
