# Visual Studio's Light theme (and VS Code's Light+): its per-token defaults, its filled
# tabs, Consolas.
#
# In its published colours, as its authors chose them: Fenix's own copy
# keeps every colour at a contrast it can read; this one doesn't.
name = "Visual Studio Light (original)"
tabs = "block"
font_family = "Consolas"

[surfaces]
bg = "#ffffff"
sidebar_bg = "#f5f5f5"
bg_modeline = "#eeeef2"
divider = "#cccedb"
caret = "#000000"
hl_line = "#f0f0f0"
selection = { color = "#add6ff", alpha = 0.8 }
bracket_match = { color = "#0070c1", alpha = 0.12 }
search_match = { color = "#f8c9ab", alpha = 0.6 }

[text]
fg = "#000000"
caret_text = "#000000"
gutter_fg = "#237893"

[modes]
normal = "#007acc"
insert = "#388a34"
visual = "#c42b1c"
replace = "#895503"
command = "#0070c1"
explorer = "#007acc"
picker = "#af00db"
text_dark = "#ffffff"

[syntax]
keyword = "#0000ff"
string = "#a31515"
comment = "#008000"
function = "#74531f"
type = "#2b91af"
number = "#098658"
constant = "#0070c1"
variable = "#001080"
operator = "#383838"
punctuation = "#3b3b3b"
attribute = "#e50000"

[explorer]
folder = "#c09553"
file = "#000000"

[git]
modified = "#895503"
staged = "#388a34"
untracked = "#007acc"
ignored = "#6e7681"
conflicted = "#ad0707"
