# Atom's One Light.
#
# In its published colours, as its authors chose them: Fenix's own copy
# keeps every colour at a contrast it can read; this one doesn't.
name = "One Light (original)"
tabs = "underline"

[surfaces]
bg = "#fafafa"
sidebar_bg = "#fafafa"
bg_modeline = "#eaeaeb"
divider = "#d4d4d4"
caret = "#526fff"
hl_line = "#f0f0f1"
selection = { color = "#4078f2", alpha = 0.15 }
bracket_match = { color = "#50a14f", alpha = 0.15 }
search_match = { color = "#c18401", alpha = 0.2 }

[text]
fg = "#383a42"
caret_text = "#526fff"
gutter_fg = "#a0a1a7"

[modes]
normal = "#4078f2"
insert = "#50a14f"
visual = "#a626a4"
replace = "#c18401"
command = "#0184bc"
explorer = "#4078f2"
picker = "#a626a4"
text_dark = "#fafafa"

[syntax]
keyword = "#a626a4"
string = "#50a14f"
comment = "#a0a1a7"
function = "#4078f2"
type = "#c18401"
number = "#986801"
constant = "#986801"
variable = "#383a42"
operator = "#0184bc"
punctuation = "#0184bc"
attribute = "#c18401"

[explorer]
folder = "#4078f2"
file = "#383a42"

[git]
modified = "#c18401"
staged = "#50a14f"
untracked = "#4078f2"
ignored = "#a0a1a7"
conflicted = "#e45649"
