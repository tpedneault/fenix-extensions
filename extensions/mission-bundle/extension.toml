[extension]
id = "fenix.mission-bundle"
name = "Mission"
version = "1.0.0"
description = "SCOS-2000 MIB, CCSDS & PUS, Tcl"
authors = ["Thomas Pedneault"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpedneault/fenix-extensions"
categories = ["mission"]
# A bundle: nothing of its own, the extensions below. Installing it
# installs them; removing it removes those nothing else needs.
runtime = "bundle"

[engine]
fenix = ">=1.0, <2"

[dependencies]
"fenix.mib" = "^1"
"fenix.ccsds" = "^1"
"fenix.tcl" = "^1"
