[package]
name = "fenix-agenda"
version = "1.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Tasks on a board, a clock for your time, and their link to an issue in a tracker."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", tag = "v1.5.0" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# The tracker seam's shapes and cleaning.
fenix-tracker = { path = "../../crates/tracker" }
# Only for the Jira extension 1.2, from before the seam (`legacy`): gone
# at 2.0.
fenix-jira-client = { path = "../../crates/jira" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `testing`: the agenda's test world, for a tracker's tests.
fenix-test-kit = { path = "../../crates/test-kit", optional = true }

[features]
# The agenda on the test kit's fake host, `fenix_agenda::testing`: for a
# tracker extension's tests of the agenda against its own answers. Never
# packed: the extension is built without it.
testing = ["dep:fenix-test-kit"]

[dev-dependencies]
# A fake host for its tests, and its pages as text.
fenix-test-kit = { path = "../../crates/test-kit" }
# The Jira seam run on recorded responses, beside the old path.
futures-executor = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2.
[workspace]
