[package]
name = "fenix-lang-kit"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "What every language pack's code extension shares: the package manager page, doctor checks, tasks, installing a server or an adapter into the tools folder, a formatter and a linter."

[dependencies]
fenix-extension-api = { git = "https://github.com/tpedneault/fenix", rev = "a39d18b273ace00091d8d170382456bbad0a7c2f" }
fenix-ui-kit = { path = "../ui-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Unpacking a release in the sandbox: all pure Rust, so they build for
# wasm32-wasip2.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz"] }

[features]
# The test host (`host::mock`), for a pack's own tests.
mock = []
# A test provider for Fenix 1.6 (`tests`): the TestRunner trait, its
# adapter on the five exports and `test-provider-set`. Only a pack that
# runs tests turns it on; without it nothing of the module is built, so
# a pack's component can't import `test-provider-set` and still loads on
# Fenix 1.5 with `api = "1.5"`.
tests = []

[dev-dependencies]
# Sample archives made in the tests.
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz", "encoder"] }

# Built with whichever extension uses it.
[workspace]
