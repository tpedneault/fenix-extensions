[package]
name = "fenix-nats"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "NATS's client protocol, sans I/O: an incremental parser that borrows what it reads, the commands a client sends, headers, subjects and their wildcards, NKeys and .creds files, inboxes, and JetStream's and KV's API types."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# NKey nonce signing: Ed25519 in pure Rust, with no dependencies.
ed25519-compact = { version = "2", default-features = false }

# Built with whichever extension uses it.
[workspace]
