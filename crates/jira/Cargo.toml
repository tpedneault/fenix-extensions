[package]
name = "fenix-jira-client"
version = "1.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Jira's REST API -- Server and Data Center, and Jira Cloud -- async over a transport, and the tracker seam served over it: shared by the Jira and agenda extensions."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The seam's shapes and cleaning (`tracker`).
fenix-tracker = { path = "../tracker" }
# A worklog's start, from RFC 3339 to Jira's own form.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
futures-executor = "0.3"

# Built with whichever extension uses it.
[workspace]
